; Firmware CanSat Hellmary. Ver docs/SPEC.md.
;
; Entornos:
;   heltec_wifi_lora_32_V3  firmware de vuelo (sensores, filtros, máquina de estados,
;                           servo, telemetría, log, NVS, modo simulación por serial)
;   heltec_demo             igual + DEMO_SEPARACION (video de aceptación: servo DEMO_DELAY_S
;                           segundos después de ARMAR o de un toque largo del botón PRG)
;   heltec_banco            demo sin medición de batería (NUNCA PARA VUELO)
;   rx_station              receptor de la estación terrena (segunda Heltec V3)
;   native                  pruebas en PC (filtros, máquina de estados, servo) con datos de
;                           tools/flight_sim.py
;
; Vuelo y rx_station tienen señales de vida: LED y pantalla OLED (docs/SPEC.md).
; Uso:  pio run -e heltec_wifi_lora_32_V3 | pio run -e heltec_demo | pio run -e rx_station
;       pio test -e native

[platformio]
default_envs = heltec_wifi_lora_32_V3

; Todas las librerías con versión FIJA (sin ^): quedan en .pio/libdeps tras compilar una
; vez con internet y se pueden compilar después sin red.
[esp32_common]
platform = espressif32@^6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    ; packet.h y config.h también los usan las librerías de lib/
    -I include
lib_deps =
    jgromes/RadioLib@7.8.1

; Pantalla OLED SSD1306 (Wire1): vuelo y rx_station
[oled]
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

[env:heltec_wifi_lora_32_V3]
extends = esp32_common
board_build.filesystem = littlefs
build_src_filter = +<flight/> +<common/>
build_flags =
    ${esp32_common.build_flags}
    ; Activa la verificación de pines pendientes (#error en config.h). Solo en los
    ; entornos de la placa (este y los que lo extienden).
    -D CANSAT_FLIGHT_BOARD
    -I src/common
lib_deps =
    ${esp32_common.lib_deps}
    adafruit/Adafruit BMP280 Library@2.6.8
    adafruit/Adafruit Unified Sensor@1.1.15
    ${oled.lib_deps}

; Modo DEMO_SEPARACION: mismo firmware de vuelo con la bandera de compilación (armado por
; ARMAR o toque largo de PRG). Mismo #error de pines pendientes que el de vuelo. Para otro
; retardo:
;   build_flags = ... -D DEMO_DELAY_S=15
[env:heltec_demo]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    ${env:heltec_wifi_lora_32_V3.build_flags}
    -D DEMO_SEPARACION

; Banco: modo DEMO_SEPARACION y sin medición de batería (CANSAT_BANCO fuerza
; BATT_ADC_ENABLED = 0 en config.h; el paquete reporta batería 0).
; *** NUNCA USAR PARA VUELO: es el firmware del modo demo y no mide la pila. ***
[env:heltec_banco]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    ${env:heltec_wifi_lora_32_V3.build_flags}
    -D DEMO_SEPARACION
    -D CANSAT_BANCO

[env:rx_station]
extends = esp32_common
build_src_filter = +<rx/> +<common/>
build_flags =
    ${esp32_common.build_flags}
    -I src/common
lib_deps =
    ${esp32_common.lib_deps}
    ${oled.lib_deps}

[env:native]
platform = native
test_framework = unity
build_src_filter = +<native/>
build_flags =
    -std=gnu++17
    -Wall
    -I include
; gen_sim_data: genera los datos del simulador (CSV a 100 Hz) antes de compilar.
; native_toolchain: sin g++ en el PATH (Windows), usa zig del .venv (pip install ziglang).
extra_scripts =
    pre:scripts/gen_sim_data.py
    pre:scripts/native_toolchain.py
